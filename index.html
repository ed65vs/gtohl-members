  missedCards.forEach(m=>{
    const minIndex=Math.min(10,deck.length);
    const maxIndex=Math.max(minIndex,Math.floor(deck.length*0.8));
    const pos=minIndex+Math.floor(Math.random()*Math.max(1,maxIndex-minIndex+1));
    deck.splice(Math.min(pos,deck.length),0,m);
  });
}

function setSprite(card){
  const x=card.c===0?0:(card.c/(COLS-1))*100;
  const y=card.r===0?0:(card.r/(ROWS-1))*100;
  document.getElementById('face').style.backgroundPosition=`${x}% ${y}%`;
}

function showNext(){
  if(!deck.length) makeDeck();
  let candidate=deck.shift();
  if(candidate.name===lastName && deck.length){
    deck.push(candidate);
    candidate=deck.shift();
  }
  current=candidate;
  lastName=current.name;
  locked=false;
  setSprite(current);

  const ans=document.getElementById('answer');
  ans.disabled=false;
  ans.value='';

  const fb=document.getElementById('feedback');
  fb.textContent='';
  fb.className='';

  document.getElementById('seen').textContent=`Player ${total+1}`;
  document.getElementById('checkBtn').style.display='block';
  document.getElementById('nextBtn').style.display='none';

  // Do not force keyboard open on page load; after advancing by tap, focusing works.
  setTimeout(()=>ans.focus(),80);
}

function normalize(s){
  return s.trim().toLowerCase().replace(/[^a-z]/g,'');
}

function grade(){
  if(locked||!current)return;
  locked=true;

  const ans=document.getElementById('answer');
  const guess=normalize(ans.value);
  const target=normalize(current.first);
  const ok=guess===target;

  total++;
  if(ok){ correct++; missed.delete(current.name); }
  else{ missed.add(current.name); }

  const fb=document.getElementById('feedback');
  fb.innerHTML=`${ok?'✓':'✗'} ${current.name}<br><span style="font-size:17px;color:#aaa">${current.team} Team</span>`;
  fb.className=ok?'good':'bad';

  document.getElementById('score').textContent=`Score ${correct} / ${total}`;

  ans.blur();
  ans.disabled=true;
  document.getElementById('checkBtn').style.display='none';
  document.getElementById('nextBtn').style.display='block';
}

document.getElementById('checkBtn').addEventListener('click',grade);
document.getElementById('nextBtn').addEventListener('click',showNext);
document.getElementById('restart').addEventListener('click',()=>{
  correct=0; total=0; lastName=null; deck=[]; missed.clear();
  document.getElementById('score').textContent='Score 0 / 0';
  makeDeck();
  showNext();
});

// If iPhone happens to provide Return/Done, let it work too.
document.getElementById('answer').addEventListener('keydown',e=>{
  if(e.key==='Enter'){
    e.preventDefault();
    grade();
  }
});


document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    const nextBtn = document.getElementById('nextBtn');
    if (nextBtn.style.display !== 'none') {
      e.preventDefault();
      showNext();
    }
  }
});

makeDeck();
showNext();
</script>
</body>
</html>
